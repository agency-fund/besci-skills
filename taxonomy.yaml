# Controlled vocabularies for the Behavioral Science Skills Library.
# scripts/besci_validate.py reads this file. The site and the navigator read
# the catalog that is built from it. Change this file in the same pull
# request as the first skill that needs the change.

# Where in a project a skill is normally used. One per skill. These seven
# are strong recommendations, not rules: a skill that genuinely fits none of
# them uses `other`, which the validator accepts with a warning so that
# maintainers notice recurring gaps and extend the list.
stages:
  - id: define
    label: Define
    description: Turn a goal, population, or outcome into something specific enough to work on.
    crosswalk:
      bit_test: Target
      busara_audas: Align
      taf_eval: "Level 0: theory of change"
  - id: diagnose
    label: Diagnose
    description: "Explain why the current behavior pattern exists: barriers, drivers, context."
    crosswalk:
      bit_test: Explore
      busara_audas: Understand
      taf_eval: "Level 1: formative research"
  - id: design
    label: Design
    description: Produce intervention content, levers, messages, or strategy.
    crosswalk:
      bit_test: Solution
      busara_audas: Design
      taf_eval: "Level 1: prototype"
  - id: measure
    label: Measure
    description: Choose, adapt, or build instruments for a behavior or construct.
    crosswalk:
      bit_test: Trial (measurement)
      busara_audas: Assess
      taf_eval: "Level 2: outcome measures"
  - id: test
    label: Test
    description: Plan a pilot, experiment, or evaluation of an intervention.
    crosswalk:
      bit_test: Trial
      busara_audas: Assess
      taf_eval: "Level 3: experimental evaluation"
  - id: analyze
    label: Analyze
    description: Analyze data from a test or evaluation and interpret the result.
    crosswalk:
      bit_test: Trial (analysis)
      busara_audas: Assess
      taf_eval: "Level 3 and 4: analysis"
  - id: implement
    label: Implement
    description: Roll out, adapt, or scale what worked, and report what was done.
    crosswalk:
      bit_test: Scale
      busara_audas: Share
      taf_eval: "Level 4: scale and welfare"
  - id: other
    label: Other
    description: Does not fit the seven stages. The validator warns so maintainers can review the gap.

# Skill types. Atomic skills do one behavioral-science operation. Meta-skills
# operate on the library itself.
types:
  - atomic
  - meta

# Review status. `draft` while in review or when merged without review;
# `published` once a maintainer approved it; `deprecated` when retired.
statuses:
  - draft
  - published
  - deprecated

# Where the evidence behind a skill has been tested. Required for atomic
# skills. The value follows from the evidence scan recorded in the skill's
# references/evidence.md; `rule` says what earns each value. Researchers call
# samples from wealthy Western countries WEIRD (Western, Educated,
# Industrialized, Rich, Democratic); skills use the plain wording.
tested_in:
  - id: beyond-western-holds
    label: Tested beyond wealthy Western countries; results hold
    rule: A systematic review, or at least two field studies outside wealthy Western countries, point the same way as the original evidence.
  - id: beyond-western-differs
    label: Tested beyond wealthy Western countries; results differ
    rule: Studies outside wealthy Western countries exist, and their results differ from the original evidence or from each other.
  - id: mainly-western
    label: Tested mainly in wealthy Western countries
    rule: The scan found fewer than two field studies outside wealthy Western countries.
  - id: not-applicable
    label: Not applicable
    rule: The skill is a procedure that makes no claim about how people behave.

# Contributing organizations. Free text is accepted; these are the known ids.
orgs:
  - TAF
  - IL
  - community

# Verbs a skill name may start with. Verb-first names are the atomicity test
# applied to the folder name. Add a verb here in the same PR as the first
# skill that needs it.
verbs:
  - adapt
  - adjust
  - analyze
  - assess
  - audit
  - build
  - choose
  - cluster
  - compare
  - decompose
  - define
  - design
  - diagnose
  - draft
  - estimate
  - evaluate
  - find
  - generate
  - identify
  - map
  - measure
  - plan
  - prioritize
  - propose
  - review
  - score
  - select
  - simulate
  - specify
  - summarize
  - synthesize
  - test
  - translate
  - validate
  - write

# Vocabulary for `consumes` and `produces`. `consumes` lists the inputs a
# skill cannot run without; `produces` names the one thing its output
# template is. The site draws an arrow where one skill produces what another
# consumes. An arrow suggests that two skills fit together; people can bring
# any input from anywhere, so no input is tied to the skill that makes it.
# Unknown ids are a warning: add the type here in the same pull request.
io_types:
  - id: program-goal
    label: Program goal statement
    description: A plain-language statement of what a program is trying to achieve, with whatever context exists.
  - id: target-behavior-brief
    label: Target behavior brief
    description: One observable target behavior stated as who, what, and when, with runner-up candidates.
  - id: comb-barrier-hypotheses
    label: COM-B barrier hypotheses
    description: Competing capability, opportunity, and motivation hypotheses with diagnostic questions.
  - id: barrier-diagnosis
    label: Confirmed barrier diagnosis
    description: The barrier(s) field evidence supports, with the evidence.
  - id: intervention-levers
    label: Candidate intervention levers
    description: Two to four candidate levers per barrier, each tied to a mechanism.
  - id: intervention-draft
    label: Intervention draft
    description: A draft message, exercise, script, or product change ready for review.
  - id: interview-guide
    label: Interview or survey guide
    description: A script or protocol a researcher can run with participants.
  - id: measurement-plan
    label: Measurement plan
    description: Constructs, instruments, timing, and analysis for measuring outcomes.
  - id: survey-items
    label: Survey items
    description: Draft or existing questionnaire items for a construct.
  - id: evaluation-design
    label: Evaluation design
    description: Outcomes, comparison, sample size, and timeline for a test.
  - id: dataset-description
    label: Dataset description
    description: Column names, sample rows, and collection context for a dataset.
  - id: analysis-plan
    label: Analysis plan
    description: Pre-specified models, decision rules, and robustness checks.
  - id: qualitative-data
    label: Qualitative data
    description: Interview transcripts, field notes, or open-ended responses.
  - id: skill-draft
    label: Skill draft
    description: A skill folder drafted for this library.
  - id: eval-report
    label: Skill evaluation report
    description: Structure, triggering, and output-quality results for a skill.
  - id: workflow-draft
    label: Workflow draft
    description: An ordered set of recommended skills with their relationships.
  - id: evidence-scan-brief
    label: Evidence scan brief
    description: "What has been tried for a behavior, population, or context, with effect sizes where reported, null or contradicting findings, evidence gaps, and which findings are WEIRD-skewed."
  - id: transferability-assessment
    label: Transferability assessment
    description: "Whether one published finding is likely to hold in a named setting: the study and the setting compared on what the effect depends on, a verdict, and the assumptions to test locally."
  - id: reference-network-map
    label: Reference network map
    description: "Whose behavior and approval an audience tracks for one practice: the people named, by role, and who among them carries most weight."
  - id: ethics-review
    label: Ethics review
    description: "A check of a drafted intervention before launch: who it serves, whether people are told and can decline, who could be harmed, and a verdict of go, revise, or stop."
  - id: pilot-plan
    label: Pilot plan
    description: "A plan for a small-scale run of a program that tests whether it can be delivered and evaluated: the questions, the progression criteria fixed in advance, the sites and size, and what changes in the main design."
  - id: scale-up-strategy
    label: Scale-up strategy
    description: "How a tested program reaches routine delivery: the user organization, the environment, the resource team, the strategic choices, and prioritized actions with an owner and a date."
  - id: effect-estimate
    label: Effect estimate
    description: "The estimated effect of a program on its outcome, from an evaluation, with its unit, uncertainty, and the sample it came from."
  - id: heterogeneity-report
    label: Heterogeneity report
    description: "Who benefited more or less from a program: pre-specified subgroup results with their correction for testing many groups, kept apart from exploratory findings."
  - id: cost-effectiveness-estimate
    label: Cost-effectiveness estimate
    description: "The cost per unit of change in the outcome, with the costs counted, the effect used, and how far the ratio moves when the inputs change."
  - id: prototype-test-plan
    label: Prototype test plan
    description: "A plan for trying a draft intervention with a few people from the audience before any pilot: what to learn, with whom, how it is shown, what is recorded, and the rule for what is kept, changed, or dropped."
  - id: messenger-choice
    label: Messenger choice
    description: "Who should deliver a message or offer to an audience, chosen from named candidates, with the reason and how the choice will be checked."
  - id: wise-intervention-target
    label: Wise-intervention target
    description: "The question about themselves or their situation that an audience is asking, shown in their own words, with a check that the setting can deliver what a new answer would promise."
  - id: audience-context-brief
    label: Audience and context brief
    description: "The population operationalized as a specific subgroup, the decision moment where the behavior choice is made, the channels already reaching them, and unconfirmed WEIRD-default assumptions."
  - id: researcher-assumptions
    label: Researcher assumption statement
    description: "A research team's own short, honest answers about what they already believe causes the behavior gap, which population they have worked with most, and what would change their mind, given before looking at diagnostic data."
  - id: bias-audit-report
    label: Bias audit report
    description: "A flag list of which stated researcher assumptions are unfalsifiable as written, default to a WEIRD population as the norm, or lack a named disconfirming observation. Not a score and not a debiasing plan."
  - id: prior-intervention-record
    label: Prior intervention record
    description: "A team's own written account of an intervention it already tried: what was planned, what it believes happened, and why it believes it succeeded or failed."
  - id: intervention-post-mortem
    label: Intervention post-mortem brief
    description: "A retrospective separating what was planned from what was implemented, classifying the result as implementation failure, idea failure, or cannot yet tell, and checking the team's causal story against the data collected."
  - id: ai-use-account
    label: AI use account
    description: "A team's raw account of how a piece of work was produced: who did which parts, which AI tools were used where and how heavily, and anything they are unsure whether to disclose."
  - id: sifa-declaration
    label: SIFA declaration
    description: "A Statement of Intellectual Fellowship and Accountability: per CRediT contributor role, the human contributors, any AI tool, the extent of AI involvement on a none/some/extensive scale, and an audit note."
  - id: ai-product-account
    label: AI product account
    description: "A team's plain-language account of an AI product: what it does and for whom, the development outcome it targets, its maturity, the evaluation evidence that exists, and the decision the team wants to inform next."
  - id: ai-eval-level-recommendation
    label: AI evaluation level recommendation
    description: "Per level of The Agency Fund's four-level AI evaluation framework, which evaluations the product has earned now, which are premature and why, and the evaluability-early steps to take regardless."
  - id: experiment-intent
    label: Experiment intent statement
    description: "A team's plain-language statement of the change it wants to test, who it applies to, what it expects to move, and the decision the result will inform."
  - id: agency-definition
    label: Agency definition
    description: "What a team means by its users' agency, stated precisely, matched to established constructs and theories, and placed on the 2x2 agency framework (forms: the end goal or the digital tool; manifestations: thoughts and feelings, or choices and actions), with the cells the team chose to focus on."
  - id: theory-of-change
    label: Theory of change
    description: "The causal chain from activities to the target behavior to the outcome, with the assumption and evidence behind each link."
  - id: social-norm-diagnosis
    label: Social norm diagnosis
    description: "Whether a practice is held in place by empirical and normative expectations, with the reference group and the evidence behind the call."
  - id: effect-size-benchmark
    label: Effect-size benchmark
    description: "The effect size a test should plan for, discounted for publication bias and lab-to-field shrinkage, with the sources behind it."
  - id: power-calculation
    label: Power calculation
    description: "Sample size, minimum detectable effect, and the assumptions behind them: variance, intracluster correlation, take-up, attrition."
  - id: scalability-assessment
    label: Scalability assessment
    description: "Whether a piloted effect is likely to survive scale-up, with the named threats and what to test before scaling."
  - id: adaptation-record
    label: Adaptation record
    description: "Planned and unplanned modifications to an intervention, each classified and checked against the intervention's core components."
  - id: fidelity-plan
    label: Fidelity monitoring plan
    description: "Indicators, sampling frequency, and feedback loop for monitoring adherence, dose, and quality of delivery."
  - id: intervention-description
    label: Intervention description
    description: "An item-by-item description of an intervention as delivered, complete enough for another team to replicate it."

